[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "crous-logement-bot"
version = "0.1.0"
description = "Multilingual CROUS accommodation monitoring Telegram bot"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiogram>=3.30,<4",
  "fastapi>=0.140,<0.141",
  "uvicorn[standard]>=0.51,<0.52",
  "sqlalchemy[asyncio]>=2.0.51,<2.1",
  "asyncpg>=0.31,<0.32",
  "alembic>=1.18.5,<2",
  "redis>=5.3.1,<6",
  "arq>=0.28,<0.29",
  "httpx>=0.28.1,<0.29",
  "selectolax>=0.4.11,<0.5",
  "pydantic-settings>=2.14.2,<3",
  "structlog>=26.1,<27",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.16,<0.17",
  "mypy>=2.3,<2.4",
  "aiosqlite>=0.22.1,<0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "E701", "E702"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["alembic"]
disable_error_code = ["arg-type", "union-attr", "no-any-return", "no-untyped-def"]

[tool.uv]
required-version = ">=0.11.27,<0.12"
