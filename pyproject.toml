[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "crous-logement-bot"
version = "0.1.0"
description = "Multilingual CROUS accommodation monitoring Telegram bot"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4", "fastapi>=0.115", "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "alembic>=1.13",
  "redis>=5.0", "arq>=0.26", "httpx>=0.27", "selectolax>=0.3",
  "pydantic-settings>=2.4", "python-dotenv>=1.0", "structlog>=24.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "aiosqlite>=0.20"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "E701", "E702"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["alembic"]
disable_error_code = ["arg-type", "union-attr", "no-any-return", "no-untyped-def"]
