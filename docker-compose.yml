services:
  postgres:
    image: postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: crous
      POSTGRES_USER: crous
      POSTGRES_PASSWORD: crous
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crous -d crous"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [crous_internal]

  redis:
    image: redis:7.4.10-alpine3.21@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [crous_internal]

  migrate:
    build: .
    env_file: .env
    command: alembic upgrade head
    depends_on:
      postgres: {condition: service_healthy}
    networks: [crous_internal]

  app:
    build: .
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    expose: ["8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [crous_internal]

  api:
    build: .
    env_file: .env
    command: uvicorn app.api_main:app --host 0.0.0.0 --port 8000
    expose: ["8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [crous_internal]

  admin_panel:
    build: .
    command: uvicorn app.admin_main:app --host 0.0.0.0 --port 8000
    expose: ["8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [crous_internal]

  next_app:
    build: ./web_app
    env_file: .env
    expose: ["3000"]
    networks: [crous_internal]

  worker:
    build: .
    env_file: .env
    command: arq app.workers.tasks.WorkerSettings
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [crous_internal]

  proxy:
    image: nginx:1.30.4-alpine3.24@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    restart: unless-stopped
    depends_on:
      app: {condition: service_started}
      api: {condition: service_started}
      admin_panel: {condition: service_started}
      next_app: {condition: service_started}
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    expose: ["80"]
    ports:
      - "80:80"
    networks: [crous_internal]

volumes:
  postgres_data:

networks:
  crous_internal:
    driver: bridge
