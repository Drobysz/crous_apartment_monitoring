services:
  postgres:
    image: postgres:16.14-alpine3.24
    environment:
      POSTGRES_DB: crous
      POSTGRES_USER: crous
      POSTGRES_PASSWORD: crous
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crous -d crous"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7.4.9-alpine3.21
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    env_file: .env
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    command: python -m app.bot.runner
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
  worker:
    build: .
    env_file: .env
    command: arq app.workers.tasks.WorkerSettings
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres_data:
