events {
    worker_connections 1024;
}

http {
    log_format proxy '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout proxy;
    error_log /dev/stderr warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream app_backend {
        server app:8000;
        keepalive 32;
    }

    upstream api_backend {
        server api:8000;
        keepalive 16;
    }

    upstream admin_backend {
        server admin_panel:8000;
        keepalive 16;
    }

    upstream next_backend {
        server next_app:3000;
        keepalive 16;
    }

    upstream notification_bot_backend {
        server notification_bot:8000;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 10M;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location = /telegram/webhook {
            proxy_buffering off;
            proxy_pass http://app_backend;
        }

        location = /stripe/webhook {
            proxy_buffering off;
            proxy_pass http://app_backend;
        }

        location = /notification_bot/webhook {
            proxy_buffering off;
            proxy_pass http://notification_bot_backend/webhook;
        }

        location /payments/ {
            proxy_pass http://app_backend;
        }

        location /crous_bot_api/ {
            proxy_pass http://api_backend/;
        }

        location = /panel {
            return 308 /panel/;
        }

        location /panel/ {
            proxy_pass http://next_backend/;
            # The admin UI is authenticated and its client bundle changes with
            # deployments. Caching this HTML can pair an old boot shell with a
            # newer asset set, leaving the page stuck on "Loading data".
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }

        location /web_app/ {
            proxy_pass http://next_backend/;
        }

        location /_next/ {
            proxy_pass http://next_backend;
        }

        location / {
            proxy_pass http://app_backend;
        }
    }
}
