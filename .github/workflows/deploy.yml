name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: Commit SHA to deploy (defaults to the workflow commit)
        required: false
        type: string
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_SHA: ${{ inputs.image_sha || github.event.workflow_run.head_sha || github.sha }}
      REGISTRY: ghcr.io
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_SHA }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_SHA }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web_app
          push: true
          tags: ${{ env.IMAGE }}-web:${{ env.IMAGE_SHA }}
      - name: Configure verified SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '${{ secrets.DEPLOY_KNOWN_HOSTS }}' > ~/.ssh/known_hosts
      - name: Deploy exact images
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
        run: |
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "PRODUCTION_PATH='${PRODUCTION_PATH}' IMAGE_TAG='${IMAGE_SHA}' IMAGE_REPOSITORY='${IMAGE}' GHCR_DEPLOY_TOKEN='${GHCR_DEPLOY_TOKEN}' GHCR_USERNAME='${{ github.actor }}' bash -s" \
            < scripts/deploy.sh
