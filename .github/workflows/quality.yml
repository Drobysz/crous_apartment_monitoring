name: Quality

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crous_migration_test
          POSTGRES_USER: crous
          POSTGRES_PASSWORD: crous
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crous -d crous_migration_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://crous:crous@127.0.0.1:5432/crous_migration_test
      MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://crous:crous@127.0.0.1:5432/crous_migration_test

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
      - run: uv sync --extra dev
      - run: uv run --extra dev pytest
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev mypy app
