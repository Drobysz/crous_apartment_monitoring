openapi: 3.1.0
info:
  title: CROUS Logement Bot API
  version: 0.1.0
  description: |
    Operational API for the multilingual CROUS accommodation monitoring bot.
    Telegram and Stripe send signed server-to-server events to webhook endpoints;
    it is not a public client API. Subscription activation happens only after a
    successfully verified Stripe event, never from a browser redirect.
    External traffic reaches the Compose stack through an HTTP-only internal
    Nginx router; TLS remains the responsibility of the external proxy.
servers:
  - url: https://{host}
    variables:
      host:
        default: bot.example.org
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Check application and CROUS availability
      responses:
        '200':
          description: The service and CROUS are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: The CROUS service is unavailable or cannot be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /telegram/webhook:
    post:
      operationId: telegramWebhook
      summary: Receive a Telegram Bot API update
      description: |
        Used only in `RUN_MODE=webhook`. Telegram must send the configured
        `WEBHOOK_SECRET` in `X-Telegram-Bot-Api-Secret-Token`.
      parameters:
        - $ref: '#/components/parameters/TelegramWebhookSecret'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramUpdate'
      responses:
        '200':
          description: The update was accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '403':
          description: The webhook secret is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Webhook mode is not configured.
          content:
            application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
  /crous_bot_api/health:
    get:
      operationId: apiHealthz
      summary: Check the namespaced internal REST API
      responses:
        '200':
          description: The internal REST API is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /panel/{path}:
    get:
      operationId: panelRoute
      summary: Same-origin administration-panel route
      parameters:
        - $ref: '#/components/parameters/PathTail'
      responses:
        '200':
          description: Administration route response.
          content:
            text/html:
              schema:
                type: string
  /web_app/{path}:
    get:
      operationId: webAppRoute
      summary: Same-origin web-application route
      parameters:
        - $ref: '#/components/parameters/PathTail'
      responses:
        '200':
          description: Web application route response.
          content:
            text/html:
              schema:
                type: string
  /payments/success:
    get:
      operationId: paymentSuccess
      summary: Show the successful-payment return page
      description: This page does not activate a subscription.
      responses:
        '200':
          description: Minimal HTML payment-result page with a Telegram bot link.
          content:
            text/html:
              schema:
                type: string
  /payments/cancel:
    get:
      operationId: paymentCancel
      summary: Show the cancelled-payment return page
      responses:
        '200':
          description: Minimal HTML payment-result page with a Telegram bot link.
          content:
            text/html:
              schema:
                type: string
  /stripe/webhook:
    post:
      operationId: stripeWebhook
      summary: Receive a verified Stripe Checkout event
      description: |
        Stripe posts raw JSON with a `Stripe-Signature` header. The service
        verifies the HMAC signature and timestamp using `STRIPE_WEBHOOK_SECRET`.
        Only `checkout.session.completed` events with `payment_status=paid` are
        processed. Checkout session and event IDs make processing idempotent.
        Do not call this endpoint from a browser or provide card data to it.
      parameters:
        - $ref: '#/components/parameters/StripeSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StripeEvent'
      responses:
        '200':
          description: The event was accepted, ignored as unrelated, or was already processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '400':
          description: The signature, event payload, or entitlement metadata is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Stripe webhook verification is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /crous_bot_api/admin/auth/login:
    post:
      operationId: adminLogin
      summary: Start an administrator session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: HttpOnly session cookies are set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfileEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /crous_bot_api/admin/auth/refresh:
    post:
      operationId: adminRefresh
      summary: Rotate an administrator refresh session
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: New HttpOnly session cookies are set.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminProfileEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfRejected'}
  /crous_bot_api/admin/auth/logout:
    post:
      operationId: adminLogout
      summary: Revoke the active administrator session
      security: [{adminCookie: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': {description: Session revoked and cookies cleared.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfRejected'}
  /crous_bot_api/admin/me:
    get:
      operationId: getAdminProfile
      summary: Read the current administrator profile
      security: [{adminCookie: []}]
      responses:
        '200':
          description: Current administrator profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminProfile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /crous_bot_api/admin/dashboard:
    get:
      operationId: getAdminDashboard
      summary: Read paid live revenue and operating statistics
      security: [{adminCookie: []}]
      parameters:
        - name: period
          in: query
          schema: {type: string, enum: [week, month, year], default: month}
      responses:
        '200':
          description: Current-period dashboard data.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDashboard'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /crous_bot_api/admin/dashboard/recent-buyers:
    get:
      operationId: getRecentBuyers
      summary: Read recent paid live purchases
      security: [{adminCookie: []}]
      responses:
        '200':
          description: Recent buyers, newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BuyerList'}
  /crous_bot_api/admin/admins:
    get:
      operationId: listAdmins
      summary: Search and paginate administrators
      security: [{adminCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Administrator page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminPage'}
    post:
      operationId: createAdmin
      summary: Create an administrator as a superadmin
      security: [{adminCookie: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminCreateRequest'}
      responses:
        '201':
          description: Administrator created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminProfile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfRejected'}
        '409': {$ref: '#/components/responses/Conflict'}
  /crous_bot_api/admin/paid-users:
    get:
      operationId: listPaidUsers
      summary: Search and paginate users with an effective non-Free plan
      security: [{adminCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Paid user page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaidUserPage'}
  /crous_bot_api/admin/transactions:
    get:
      operationId: listTransactions
      summary: Search and paginate payment transactions
      security: [{adminCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Transaction page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransactionPage'}
components:
  securitySchemes:
    adminCookie:
      type: apiKey
      in: cookie
      name: crous_admin_access
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 1}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Search:
      name: q
      in: query
      schema: {type: string, maxLength: 100}
    PathTail:
      name: path
      in: path
      required: true
      schema:
        type: string
    TelegramWebhookSecret:
      name: X-Telegram-Bot-Api-Secret-Token
      in: header
      required: true
      description: Value configured through `WEBHOOK_SECRET`.
      schema:
        type: string
        minLength: 1
    StripeSignature:
      name: stripe-signature
      in: header
      required: true
      description: Stripe's signed payload header. It is verified with `STRIPE_WEBHOOK_SECRET`.
      schema:
        type: string
        minLength: 1
  responses:
    Unauthorized:
      description: A valid administrator session is required.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    CsrfRejected:
      description: Origin or CSRF validation failed.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    RateLimited:
      description: Too many sign-in attempts.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Conflict:
      description: The requested mutation conflicts with existing protected data.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  schemas:
    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, example: '@gogona'}
        password: {type: string, writeOnly: true}
    AdminCreateRequest:
      type: object
      required: [name, username, password]
      properties:
        name: {type: string}
        username: {type: string}
        password: {type: string, writeOnly: true, minLength: 12}
        role: {type: string, enum: [admin, superadmin], default: admin}
    AdminProfile:
      type: object
      required: [id, name, username, role, is_active, created_at]
      properties:
        id: {type: integer}
        name: {type: string}
        username: {type: string, example: '@gogona'}
        role: {type: string, enum: [admin, superadmin]}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}
        last_login_at: {type: [string, 'null'], format: date-time}
    AdminProfileEnvelope:
      type: object
      required: [admin]
      properties: {admin: {$ref: '#/components/schemas/AdminProfile'}}
    PageMeta:
      type: object
      required: [page, page_size, total, pages]
      properties:
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}
        pages: {type: integer}
    AdminPage:
      type: object
      required: [items, meta]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminProfile'}}
        meta: {$ref: '#/components/schemas/PageMeta'}
    RevenuePoint:
      type: object
      required: [key, amount_cents]
      properties: {key: {type: string}, amount_cents: {type: integer}}
    AdminDashboard:
      type: object
      required: [total_users, active_paid_subscribers, active_monitoring_anchors, revenue_cents, revenue_series]
      properties:
        total_users: {type: integer}
        active_paid_subscribers: {type: integer}
        active_monitoring_anchors: {type: integer}
        revenue_cents: {type: integer}
        revenue_series: {type: array, items: {$ref: '#/components/schemas/RevenuePoint'}}
    BuyerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [purchase_id, plan, amount_cents, status]
            properties:
              purchase_id: {type: integer}
              username: {type: [string, 'null']}
              plan: {type: string}
              amount_cents: {type: integer}
              purchased_at: {type: [string, 'null'], format: date-time}
              status: {type: string}
    PaidUserPage:
      type: object
      required: [items, meta]
      properties:
        items: {type: array, items: {type: object}}
        meta: {$ref: '#/components/schemas/PageMeta'}
    TransactionPage:
      type: object
      required: [items, meta]
      properties:
        items: {type: array, items: {type: object}}
        meta: {$ref: '#/components/schemas/PageMeta'}
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
          example: ok
    AcceptedResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          example: CROUS unavailable
    TelegramUpdate:
      type: object
      description: |
        Telegram Bot API Update. The application validates the complete payload
        with aiogram at runtime; fields vary by update type.
      required: [update_id]
      properties:
        update_id:
          type: integer
          format: int64
          example: 100000001
        message:
          $ref: '#/components/schemas/TelegramMessage'
        callback_query:
          $ref: '#/components/schemas/TelegramCallbackQuery'
      additionalProperties: true
    StripeEvent:
      type: object
      description: |
        Stripe event envelope. The application supports `checkout.session.completed`.
        The event and Checkout Session identifiers are stored as idempotency keys.
      required: [id, type, data]
      properties:
        id:
          type: string
          example: evt_123
        type:
          type: string
          example: checkout.session.completed
        data:
          type: object
          required: [object]
          properties:
            object:
              $ref: '#/components/schemas/StripeCheckoutSession'
      additionalProperties: true
    StripeCheckoutSession:
      type: object
      required: [id, payment_status, metadata]
      properties:
        id:
          type: string
          example: cs_test_123
        payment_status:
          type: string
          const: paid
        payment_intent:
          type: [string, 'null']
        amount_total:
          type: integer
          description: Amount in EUR cents.
          example: 999
        currency:
          type: string
          example: eur
        client_reference_id:
          type: [string, 'null']
        metadata:
          type: object
          required: [telegram_user_id, internal_user_id, subscription_id, plan_code]
          properties:
            telegram_user_id:
              type: string
            internal_user_id:
              type: string
            subscription_id:
              type: string
            plan_code:
              type: string
              enum: [season, lifetime]
          additionalProperties:
            type: string
    TelegramUser:
      type: object
      required: [id, is_bot, first_name]
      properties:
        id:
          type: integer
          format: int64
        is_bot:
          type: boolean
        first_name:
          type: string
        language_code:
          type: string
          example: fr
    TelegramChat:
      type: object
      required: [id, type]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          example: private
    TelegramLocation:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    TelegramMessage:
      type: object
      required: [message_id, date, chat]
      properties:
        message_id:
          type: integer
        date:
          type: integer
          description: Unix time.
        chat:
          $ref: '#/components/schemas/TelegramChat'
        from:
          $ref: '#/components/schemas/TelegramUser'
        text:
          type: string
        location:
          $ref: '#/components/schemas/TelegramLocation'
      additionalProperties: true
    TelegramCallbackQuery:
      type: object
      required: [id, from]
      properties:
        id:
          type: string
        from:
          $ref: '#/components/schemas/TelegramUser'
        data:
          type: string
          description: Compact aiogram callback payload.
        message:
          $ref: '#/components/schemas/TelegramMessage'
      additionalProperties: true
